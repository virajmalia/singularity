name: Build and Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential cmake libssl-dev libcurl4-openssl-dev libgit2-dev
        pip install conan>=2.0.0
    
    - name: Configure Conan and Build
      run: |
        # Make scripts executable
        chmod +x ./scripts/*.sh
        
        # Setup Conan profiles
        ./scripts/setup_conan.sh
        
        # Build using the build script
        ./scripts/build.sh
    
    - name: Run tests
      run: |
        cd build
        ctest --output-on-failure
    
    - name: Package
      run: |
        cd build
        cpack -G TGZ
    
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: singularity-package
        path: build/*.tar.gz

  docker:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Build Docker image
      run: docker build -t singularity:latest .
    
    - name: Test Docker image
      run: docker run --rm singularity:latest --version
