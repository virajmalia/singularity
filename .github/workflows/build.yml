name: Build and Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: alpine:edge
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Install dependencies
      run: |
        # Update package lists and install necessary tools
        apk update
        apk add --no-cache \
          clang20 \
          cmake \
          ninja \
          python3 \
          py3-pip \
          bash \
          git \
          build-base
        
        # Install conan
        pip3 install conan
    
    - name: Configure Conan and Build
      run: |
        # Make scripts executable
        chmod +x ./scripts/*.sh
        
        # Build using the main build script with clang option
        ./scripts/build.sh --clang
    
    - name: Run tests
      run: |
        cd build
        ctest --output-on-failure
    
    - name: Package
      run: |
        cd build
        cpack -G TGZ
    
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: singularity-package
        path: build/*.tar.gz

  docker:
    needs: build
    runs-on: ubuntu-latest
    container:
      image: alpine:edge
    if: github.ref == 'refs/heads/main'
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Build Docker image
      run: docker build -t singularity:latest .
    
    - name: Test Docker image
      run: docker run --rm singularity:latest --version
