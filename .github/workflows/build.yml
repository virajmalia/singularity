name: Build and Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: alpine:edge
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Install dependencies
      run: |
        # Update package lists and install necessary tools
        apk update
        apk add --no-cache \
          clang20 \
          clang20-libclang \
          llvm20 \
          lld \
          cmake \
          ninja \
          python3 \
          py3-pip \
          python3-dev \
          bash \
          git \
          build-base \
          libstdc++ \
          libstdc++-dev \
          libc++-dev \
          libc++abi-dev \
          libc++ \
          libc++abi
        
        # Create and activate Python virtual environment
        python3 -m venv /opt/venv
        source /opt/venv/bin/activate
        
        # Install conan in the virtual environment
        pip install --upgrade pip
        pip install conan
    
    - name: Configure Conan and Build
      run: |
        # Activate Python virtual environment
        source /opt/venv/bin/activate
        
        # Make scripts executable
        chmod +x ./scripts/*.sh
        
        # Print diagnostic information
        echo "=== System Information ==="
        uname -a
        echo "=== Clang Information ==="
        clang --version
        echo "=== Library Paths ==="
        ls -la /usr/lib | grep 'libc++\|libstdc++'
        ls -la /usr/lib/llvm* 2>/dev/null || echo "No llvm lib directory"
        echo "=== Compiler Search Paths ==="
        clang -print-search-dirs
        
        # Build using the main build script with clang option
        ./scripts/build.sh --clang
    
    - name: Run tests
      run: |
        # Activate Python virtual environment
        source /opt/venv/bin/activate
        
        cd build
        ctest --output-on-failure
    
    - name: Package
      run: |
        # Activate Python virtual environment
        source /opt/venv/bin/activate
        
        cd build
        cpack -G TGZ
    
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: singularity-package
        path: build/*.tar.gz

  docker:
    needs: build
    runs-on: ubuntu-latest
    # Don't use Alpine container for the Docker job since it needs Docker daemon
    if: github.ref == 'refs/heads/main'
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Build Docker image
      run: docker build -t singularity:latest .
    
    - name: Test Docker image
      run: docker run --rm singularity:latest --version
