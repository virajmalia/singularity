---
# MegaLinter GitHub Actions workflow for cve_scanning scans
name: MegaLinter cve_scanning

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  megalinter-cve_scanning:
    name: MegaLinter cve_scanning Scan
    runs-on: ubuntu-latest
    steps:
      # Checkout code
      - name: Checkout Code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      # MegaLinter
      - name: MegaLinter cve_scanning Scan
        id: ml
        uses: oxsecurity/megalinter@v8
        env:
          VALIDATE_ALL_CODEBASE: true
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Dynamically enable linters based on detected languages: C++, Shell, CMake, Dockerfile, Python, 
          ENABLE_LINTERS: >-
            REPOSITORY_DEPENDABOT,

          # Tool-specific configurations

      # Upload MegaLinter artifacts
      - name: Archive production artifacts
        uses: actions/upload-artifact@v3
        if: success() || failure()
        with:
          name: MegaLinter reports
          path: |
            megalinter-reports
            mega-linter.log

      # Create pull request with fixes if applicable
      - name: Create Pull Request with applied fixes
        uses: peter-evans/create-pull-request@v4
        if: steps.ml.outputs.has_updated_sources == 1 && (env.APPLY_FIXES == 'all' || env.APPLY_FIXES == 'true')
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "[MegaLinter] Apply cve_scanning fixes"
          title: "[MegaLinter] Apply cve_scanning fixes"
          labels: bot
